server:
  port: 8084

spring:
  application:
    name: batch-service
  datasource:
    url: jdbc:postgresql://localhost:5432/batch_db
    username: postgres
    password: ${BATCH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
recommendation:
  scheduler:
    cron: "0 */1 * * * *"

batch-service:
  game-service-url: ${GAME_SERVICE_URL:http://localhost:8081}
  backlog-service-url: ${BACKLOG_SERVICE_URL:http://localhost:8082}
