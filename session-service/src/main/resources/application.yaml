server:
  port: 8083

spring:
  application:
    name: session-service
  datasource:
    url: jdbc:postgresql://localhost:5432/session_db
    username: postgres
    password: ${SESSION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

game-service:
  base-url: ${GAME_SERVICE_URL:http://localhost:8081}